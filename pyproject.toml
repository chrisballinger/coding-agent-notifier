[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-notifier"
version = "0.1.0"
description = "Slack (and more) pings when a coding agent needs your attention and you're away from the keyboard."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Ballinger" }]
dependencies = [
    "tomlkit>=0.12",
]

[project.optional-dependencies]
# Interactive Slack bot (chat.postMessage + Socket Mode). Only needed when
# [sinks.slack] has interactive=true or actionable_approvals=true.
slack-bot = ["slack-sdk>=3.27"]

[project.scripts]
agent-notify = "coding_agent_notifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_notifier"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coding_agent_notifier --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["coding_agent_notifier"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
